# AlmaLinux Apache (httpd 2.4.62, >= 2.4.34 for <IfFile>).
# Installed path: /etc/httpd/conf.d/zz-tfg-monitor.conf
#
# The zz- prefix ensures this configuration loads after cmo.conf and zz-cmb.conf,
# keeping existing virtual host precedence completely intact.
# A missing certificate must never stop Apache, as httpd also serves CMO and CMB:
# HTTPS vhost is safely guarded by <IfFile> directives.

<VirtualHost *:80>
    ServerName monitor.tinfundinggroup.net
    Alias /.well-known/acme-challenge/ /var/www/tfg-monitor/acme/.well-known/acme-challenge/

    <Directory /var/www/tfg-monitor/acme>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://monitor.tinfundinggroup.net%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<IfFile "/etc/letsencrypt/live/monitor.tinfundinggroup.net/fullchain.pem">
<IfFile "/etc/letsencrypt/live/monitor.tinfundinggroup.net/privkey.pem">
<VirtualHost *:443>
    ServerName monitor.tinfundinggroup.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/monitor.tinfundinggroup.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.tinfundinggroup.net/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyRequests Off
    ProxyPreserveHost On

    # Anti-spoofing: Apache is the trusted edge reverse proxy.
    # Unset all client-supplied forwarding headers to prevent IP spoofing attacks.
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Client-IP
    RequestHeader unset CF-Connecting-IP
    RequestHeader unset True-Client-IP

    # Set trusted protocol; mod_proxy_http (ProxyAddHeaders On) natively injects real TCP IP into X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"

    # Block public access to internal Prometheus metrics, unauthenticated serverStatus ingestion, and public OpenAPI UI docs
    ProxyPass /_prom !
    <Location "/_prom">
        Require all denied
    </Location>

    ProxyPass /serverStatus !
    <Location "/serverStatus">
        Require all denied
    </Location>

    ProxyPassMatch "^/open/_(ui|swagger|document)" !
    <LocationMatch "^/open/_(ui|swagger|document)">
        Require all denied
    </LocationMatch>

    ProxyPassMatch "^/api/(ai|ai-router|application)(/|$)" !
    <LocationMatch "^/api/(ai|ai-router|application)(/|$)">
        Require all denied
    </LocationMatch>

    # Restrict public analytics ingestion payload size to 64 KB (DoS protection)
    <LocationMatch "^/api/(website|application)/(send|batch)$">
        <LimitExcept POST>
            Require all denied
        </LimitExcept>
        LimitRequestBody 65536
    </LocationMatch>

    # Forward HTTP and WebSockets (Socket.IO / telemetry ws) to Podman container
    # upgrade=websocket is natively supported in Apache httpd >= 2.4.47
    ProxyPass / http://127.0.0.1:12345/ upgrade=websocket retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:12345/

    # Asset compression
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>
    <IfModule !mod_brotli.c>
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
        </IfModule>
    </IfModule>

    ErrorLog /var/log/httpd/tfg-monitor-error.log
    CustomLog /var/log/httpd/tfg-monitor-access.log "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>
</IfFile>
</IfFile>
